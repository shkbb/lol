<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autopara</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22V10l7 5 7-5v12' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="brand-name">autopara</div>
        <div class="brand-sub" id="brand-status">…</div>
      </div>
    </div>
    <nav id="nav">
      <button data-page="home" class="active">Головна</button>
      <button data-page="timetable">Розклад</button>
      <button data-page="study">Навчання</button>
      <div class="nav-label">Налаштування</div>
      <button data-page="group">Група</button>
      <button data-page="links">Посилання</button>
      <button data-page="accounts">Акаунти</button>
      <button data-page="assistant">Помічник</button>
      <button data-page="telegram">Telegram</button>
      <button data-page="behaviour">Поведінка</button>
      <div class="nav-label"></div>
      <button data-page="log">Журнал</button>
    </nav>
  </aside>

  <main id="main"></main>

  <div class="savebar" id="savebar" hidden>
    <span>Є незбережені зміни</span>
    <button class="ghost" id="discard">Скасувати</button>
    <button class="primary" id="save">Зберегти</button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
