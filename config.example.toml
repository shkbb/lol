# Шаблон конфіга: скопіюй у config.toml і заповни посилання.
# Секрети (токен Telegram-бота) пиши в config.local.toml — він у .gitignore.

[schedule]
group = "ТЦР-32"

# Необов'язково: ID з `autopara find-group`, щоб не шукати групу на сайті щоразу.
# faculty_id = 0
# course = 3
# group_id = 0

# Необов'язково: прізвище та ім'я, як на сайті розкладу. Тоді розклад береться
# саме твій, з урахуванням підгруп (список — `autopara find-group --students`).
# student = "Прізвище Ім'я"

days_ahead = 7            # на скільки днів уперед тягнути розклад
refresh_minutes = 60      # як часто оновлювати розклад (пари іноді переносять)
use_schedule_links = true # якщо для пари немає правила нижче, брати посилання з самого розкладу

[join]
minutes_before = 2        # за скільки хвилин до початку заходити
mute_microphone = true
camera_off = true
mute_sound = true         # у динаміках тиша; false — чуєш пару і ти (Zoom-клієнт — див. README)
auto_leave = true         # виходити з пари самому

# Виходити разом з групою, а не рівно за розкладом: якщо пару відпустили раніше —
# вийде, коли вийде більшість; якщо затягнулась — лишиться, поки люди не почнуть виходити.
# Якщо ти сам увімкнеш мікрофон — вважається, що ти за ноутом, і програма не вийде.
smart_leave = true
max_overtime_minutes = 20 # але не довше, ніж стільки хвилин після кінця за розкладом

# Через скільки хвилин після кінця пари виходити, якщо порахувати учасників не вдалося
# (або smart_leave = false).
leave_after_minutes = 0

# "app" — відкривати Zoom-клієнт (надійніше), "browser" — веб-версія Zoom у браузері (експериментально).
zoom_mode = "app"

# Ім'я для входу гостем (Zoom у браузері, або Meet без логіну).
display_name = ""

# Якщо в браузері кілька Google-акаунтів — email того, з яким ходиш на пари.
meet_account = ""

# "chrome" — встановлений Google Chrome, "msedge" — Edge, "" — вбудований Chromium з Playwright.
browser_channel = "chrome"
# Або шлях до будь-якого Chromium-браузера (має пріоритет над browser_channel).
# Arch Linux з пакетом chromium: browser_path = "/usr/bin/chromium"
browser_path = ""

# --- Помічник (див. README → «Помічник») ---------------------------------------

[me]
name = ""                 # «Прізвище Ім'я» — щоб помічати, коли тебе кличуть, і відмічатись прізвищем
chat_reply = "auto"       # коли група масово пише «+»: "auto" — писати самому, "ask" — спитати в Telegram, "off"
present = "Присутній"     # що писати, коли група відмічається словами «присутній», «тут»

[telegram]
# token і chat_id — у config.local.toml (він не потрапляє в git); `autopara telegram` допоможе.
clips = true              # відеовирізка моменту, коли тебе згадали (потрібен ffmpeg)

[ears]                    # слухати пару (Linux + PipeWire, локальне розпізнавання мови)
enabled = false
model = "small"           # small — швидко, але плутає прізвища; large-v3-turbo — значно точніше (autopara listen-test)
language = "uk"

[brain]                   # локальна мовна модель через Ollama
enabled = false
model = "gemma3:4b"
url = "http://127.0.0.1:11434"

# --- Посилання на пари ---------------------------------------------------------
# Правило спрацьовує, якщо в назві предмета (повній чи скороченій; і, якщо задано,
# в типі заняття та імені викладача) є вказаний текст. Регістр не важливий, кілька
# варіантів — через «|». Перевіряються згори донизу — перше, що підійшло, і
# використовується. Тож конкретніші правила (з type чи teacher) пиши вище за загальні.
# account — інший Google-акаунт для цього посилання (якщо зустріч не пускає з основного).
# Подивитись, як предмети й типи називаються на сайті: `autopara schedule`.

[[links]]
subject = "Бази даних"
type = "Лк"               # лише лекції (Лк, Пз, Лб — як на сайті)
url = "https://meet.google.com/aaa-bbbb-ccc"

[[links]]
subject = "Бази даних"    # усе інше з цього предмета
url = "https://us05web.zoom.us/j/12345678901?pwd=AbCdEf"

[[links]]
subject = "Англійська"
teacher = "Петренко"
account = "me@gmail.com"  # ця зустріч пускає лише з особистої пошти
url = "https://meet.google.com/ddd-eeee-fff"

[[links]]
subject = "Фізичне виховання"
skip = true               # на цю пару не заходити
