# Шаблон для ручного налаштування. Простіше — у вікні програми: `autopara app`.
# Готовий файл можна підхопити командою `autopara import-config мій.toml`.
# Секрети (токен Telegram-бота) можна тримати окремо в config.local.toml поруч — він у .gitignore.

[schedule]
university = "duikt"      # "duikt" — ДУІКТ, "kpi" — КПІ ім. Ігоря Сікорського
group = "ТЦР-32"          # для КПІ можна вставити посилання з schedule.kpi.ua (з ?groupId=...)

# ДУІКТ, необов'язково: ID з `autopara find-group`, щоб не шукати групу на сайті щоразу.
# faculty_id = 0
# course = 3
# group_id = 0

# ДУІКТ, необов'язково: прізвище та ім'я, як на сайті розкладу. Тоді розклад береться
# саме твій, з урахуванням підгруп (список — `autopara find-group --students`).
# student = "Прізвище Ім'я"

days_ahead = 7            # на скільки днів уперед тягнути розклад
refresh_minutes = 60      # як часто оновлювати розклад (пари іноді переносять)
use_schedule_links = true # якщо для пари немає правила нижче, брати посилання з самого розкладу

[join]
minutes_before = 2        # за скільки хвилин до початку заходити
mute_microphone = true
camera_off = true
mute_sound = true         # у динаміках тиша; false — чуєш пару і ти (Zoom-клієнт — див. README)
auto_leave = true         # виходити з пари самому

# Виходити разом з групою, а не рівно за розкладом: якщо пару відпустили раніше —
# вийде, коли вийде більшість; якщо затягнулась — лишиться, поки люди не почнуть виходити.
# Якщо ти сам увімкнеш мікрофон — вважається, що ти за ноутом, і програма не вийде.
smart_leave = true
max_overtime_minutes = 20 # але не довше, ніж стільки хвилин після кінця за розкладом

# Через скільки хвилин після кінця пари виходити, якщо порахувати учасників не вдалося
# (або smart_leave = false).
leave_after_minutes = 0

# "auto" — Zoom-клієнт, якщо вуха можуть його чути (Linux, віртуальний кабель), інакше Zoom у браузері,
# а якщо там не пустять — клієнт; "app" — завжди клієнт; "browser" — завжди браузер.
zoom_mode = "auto"

# Ім'я для входу гостем (Zoom у браузері, або Meet без логіну).
display_name = ""

# Якщо в браузері кілька Google-акаунтів — email того, з яким ходиш на пари.
meet_account = ""

# "chrome" — встановлений Google Chrome, "msedge" — Edge, "" — вбудований Chromium з Playwright.
browser_channel = "chrome"
# Або шлях до будь-якого Chromium-браузера (має пріоритет над browser_channel).
# Arch Linux з пакетом chromium: browser_path = "/usr/bin/chromium"
browser_path = ""

# --- Помічник (див. README → «Помічник») ---------------------------------------

[me]
name = ""                 # «Прізвище Ім'я» — щоб помічати, коли тебе кличуть, і відмічатись прізвищем
chat_reply = "auto"       # писати в чат пари: "auto" — самому, де сигнали надійні; "ask" — спитати в Telegram; "off" — ніколи
# Що саме можна писати самому (false — лише питає тебе; ввічливості — просто мовчить):
roll_call = true          # відмічатися на перекличці: «+», «присутній», прізвище
answer_here = true        # відповідати, коли викладач питає саме тебе «…, ви тут?»
polite = true             # дублювати за групою «дякую», «добрий день», «до побачення»
present = "Присутній"     # що писати, коли група відмічається словами «присутній», «тут»
here = "Так, я тут"       # відповідь на «Ляшко, ви тут?»
quick_replies = ["Присутній", "Так, я тут"]  # кнопки-відповіді в Telegram, коли тебе кличуть

[telegram]
# token і chat_id найпростіше отримати у вікні програми (вкладка «Telegram»).
commands = true           # бот відповідає на команди й кнопки; false — лише надсилає сповіщення
mentions = true           # сповіщати, коли тебе кличуть
clips = true              # відеовирізка моменту, коли тебе згадали (потрібен ffmpeg)
reports = true            # звіт після пари
joins = true              # повідомляти, коли зайшов чи вийшов з пари (невдачі — завжди)
desktop = true            # дублювати сповіщення на робочий стіл (Linux)

[ears]                    # слухати пару (локальне розпізнавання мови, будь-яка ОС)
enabled = true
model = "auto"            # auto — за потужністю комп'ютера; або small (швидко) / large-v3-turbo (точніше, autopara listen-test)
language = "uk"
source = "auto"           # пари в браузері: "auto" — звук лише з вкладки пари; "pulse" — увесь звук браузера програми (Linux)
app_device = ""           # Zoom-клієнт на Windows/macOS: віртуальний кабель, напр. "CABLE Output" чи "BlackHole" (README → «Вуха»)

[brain]                   # локальна мовна модель через Ollama
enabled = true            # працює, щойно встановлена Ollama; модель програма завантажить сама
model = "gemma3:4b"
url = "http://127.0.0.1:11434"

[study]                   # завдання з Google Classroom і вижимки лекцій — робить агент (README → «Навчання»)
enabled = false
account = ""              # акаунт Classroom; порожньо — join.meet_account
folder = ""               # тека для «Роботи/<предмет>/Лб 3 …» і «Конспекти/…»; порожньо — у теці програми
# Про тебе — для титульної сторінки
full_name = ""            # ПІБ повністю
group = ""                # порожньо — schedule.group
year = 0                  # курс; 0 — з розкладу
university = ""           # порожньо — за [schedule] university
faculty = ""              # факультет / інститут; порожньо — з матеріалів курсу
department = ""           # кафедра; порожньо — з матеріалів курсу
specialty = ""            # напр. "121 Інженерія програмного забезпечення"
city = "Київ"
student_id = ""           # номер залікової — бувають варіанти за ним
# Варіант
list_number = 0           # номер у списку групи; 0 — знайти себе в списку групи з розкладу
variant_rule = ""         # як рахувати, якщо в умові не сказано; порожньо — номер у списку
# Як працювати
start_mode = "auto"       # auto — братися одразу; ask — спершу спитати «робити?»
ask_first = ["курсов", "проєкт", "проект"]  # з такими словами в назві — завжди спершу спитати
overdue_days = 60         # прострочені — робити, якщо не старші за стільки днів (0 — не робити)
skip_courses = []         # частини назв курсів, які агент не чіпає зовсім
check_hours = 3           # як часто перевіряти Classroom (лише між парами)
lecture_notes = true      # детальна вижимка після кожної пари
watch_grades = true       # писати про оцінки й повернені роботи
# Зв'язок
ask_questions = true      # агент може спитати тебе через бота, коли без тебе не обійтися
remind_hours = 24         # нагадати за стільки годин до терміну (0 — ні)
quiet_from = 23           # тихі години — повідомлення без звуку
quiet_to = 8
# Оформлення
file_format = "pdf"       # pdf | docx
file_name = "{short}_{work}"  # {short} {surname} {name} {group} {kind} {n} {work} {title} {course} {number}
language = "українська"
style = ""                # побажання до всіх робіт
examples = ""             # тека зі зразками твоїх робіт

# Правила для окремих предметів (скільки завгодно):
# [[study.courses]]
# course = "Бази даних|БД"   # частина назви курсу в Classroom
# variant = "7"              # свій варіант для цього предмета
# notes = "Лише PostgreSQL"  # побажання викладача до робіт
# mode = "auto"              # auto — робити | ask — спершу спитати | skip — не чіпати

[agent]                   # Antigravity CLI (agy), без інтерфейсу
command = "agy"
args = ["--output-format", "json", "--dangerously-skip-permissions"]
timeout_minutes = 90      # на один запуск
daily_limit = 40          # запобіжник для лімітів підписки
attempts = 3              # спроб довести роботу до повністю готової (кожна — виконання + сувора перевірка)

# --- Посилання на пари ---------------------------------------------------------
# Правило спрацьовує, якщо в назві предмета (повній чи скороченій; і, якщо задано,
# в типі заняття та імені викладача) є вказаний текст. Регістр не важливий, кілька
# варіантів — через «|». Перевіряються згори донизу — перше, що підійшло, і
# використовується. Тож конкретніші правила (з type чи teacher) пиши вище за загальні.
# account — інший Google-акаунт для цього посилання (якщо зустріч не пускає з основного).
# Подивитись, як предмети й типи називаються на сайті: `autopara schedule`.

[[links]]
subject = "Бази даних"
type = "Лк"               # лише лекції (Лк, Пз, Лб — як на сайті)
url = "https://meet.google.com/aaa-bbbb-ccc"

[[links]]
subject = "Бази даних"    # усе інше з цього предмета
url = "https://us05web.zoom.us/j/12345678901?pwd=AbCdEf"

[[links]]
subject = "Англійська"
teacher = "Петренко"
account = "me@gmail.com"  # ця зустріч пускає лише з особистої пошти
url = "https://meet.google.com/ddd-eeee-fff"

[[links]]
subject = "Фізичне виховання"
skip = true               # на цю пару не заходити
