[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopara"
version = "0.2.0"
description = "Автоматично заходить на пари (ДУІКТ, КПІ) у Google Meet і Zoom за розкладом групи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.49",  # 1.49+: install chromium --no-shell
    "pymorphy3>=2.0",  # леми українських слів — пошук у записах пар з урахуванням відмінків
    "pymorphy3-dicts-uk>=2.4",
    "tomli-w>=1.0",  # збереження налаштувань із вікна програми
    "PySide6-Essentials>=6.8",  # вікно програми (Qt): звичайна програма для Linux, Windows і macOS
    "imageio-ffmpeg>=0.5",  # свій ffmpeg для відеовирізок — нічого не треба встановлювати окремо
    "tzdata",  # часові пояси для Windows
]

[project.optional-dependencies]
# «вуха»: локальне розпізнавання мови; sounddevice — слухати Zoom-клієнт через віртуальний кабель (Windows, macOS)
ears = ["faster-whisper>=1.0", "sounddevice>=0.4; platform_system != 'Linux'"]
# відеокарта NVIDIA: бібліотеки CUDA для Whisper (інсталятор ставить їх сам, якщо бачить NVIDIA; див. accel.py)
cuda = ["nvidia-cublas-cu12; platform_system != 'Darwin'", "nvidia-cudnn-cu12>=9,<10; platform_system != 'Darwin'"]
dev = ["pytest>=8", "numpy"]

[project.scripts]
autopara = "autopara.cli:main"

[project.gui-scripts]
autopara-window = "autopara.cli:window"  # на Windows — без вікна консолі (для ярлика)

[tool.setuptools]
packages = ["autopara", "autopara.gui"]

[tool.setuptools.package-data]
autopara = ["*.js"]  # збирач звуку пари для вух (ears_tap.js)
"autopara.gui" = ["*.svg"]  # значок програми

[tool.pytest.ini_options]
testpaths = ["tests"]
