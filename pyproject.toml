[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopara"
version = "0.1.0"
description = "Автоматично заходить на пари (ДУІКТ, КПІ) у Google Meet і Zoom за розкладом групи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "tomli-w>=1.0",  # збереження налаштувань із вікна програми
    "tzdata",  # часові пояси для Windows
]

[project.optional-dependencies]
# «вуха»: локальне розпізнавання мови; sounddevice — слухати Zoom-клієнт через віртуальний кабель (Windows, macOS)
ears = ["faster-whisper>=1.0", "sounddevice>=0.4; platform_system != 'Linux'"]
dev = ["pytest>=8", "numpy"]

[project.scripts]
autopara = "autopara.cli:main"

[project.gui-scripts]
autopara-window = "autopara.cli:window"  # на Windows — без вікна консолі (для ярлика)

[tool.setuptools]
packages = ["autopara", "autopara.ui"]

[tool.setuptools.package-data]
autopara = ["*.js"]  # збирач звуку пари для вух (ears_tap.js)
"autopara.ui" = ["*.html", "*.js", "*.css"]  # вікно програми (не Python-код, лише файли)

[tool.pytest.ini_options]
testpaths = ["tests"]
