[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopara"
version = "0.1.0"
description = "Автоматично заходить на пари ДУІКТ у Google Meet і Zoom за розкладом групи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "tzdata",  # часові пояси для Windows
]

[project.optional-dependencies]
ears = ["faster-whisper>=1.0"]  # «вуха»: локальне розпізнавання мови
dev = ["pytest>=8"]

[project.scripts]
autopara = "autopara.cli:main"

[tool.setuptools]
packages = ["autopara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
